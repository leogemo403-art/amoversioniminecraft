<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback e Segnalazioni - Archivio Minecraft</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #2196F3;
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #fff;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #2196F3;
            outline: none;
        }
        .btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Centro Segnalazioni</h2>
        <p class="subtitle">Hai trovato un bug o vuoi suggerire un'idea? Facci sapere!</p>
        
        <form id="feedbackForm">
            <div class="form-group">
                <label for="tipo">Tipo di Segnalazione</label>
                <select id="tipo" required>
                    <option value="bug">🐛 Segnalazione Bug</option>
                    <option value="consiglio">💡 Consiglio / Nuova Funzione</option>
                    <option value="altro">💬 Altro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="messaggio">Messaggio</label>
                <textarea id="messaggio" placeholder="Descrivi il bug o il consiglio in dettaglio..." required></textarea>
            </div>

            <button type="submit" class="btn">Invia Segnalazione</button>
        </form>

        <a href="index.html" class="back-link">← Torna alla Home</a>
    </div>

    <!-- Script Firebase per inviare i dati -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Inserisci qui la tua configurazione di Firebase se non è già centralizzata
        const firebaseConfig = {
            // I tuoi dati di configurazione Firebase
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tipo = document.getElementById('tipo').value;
            const messaggio = document.getElementById('messaggio').value;

            try {
                await addDoc(collection(db, "feedback"), {
                    tipo: tipo,
                    messaggio: messaggio,
                    data: new Date().toISOString()
                });
                alert("Grazie! Il tuo feedback è stato inviato con successo.");
                document.getElementById('feedbackForm').reset();
            } catch (error) {
                console.error("Errore nell'invio:", error);
                alert("Errore durante l'invio. Riprova più tardi.");
            }
        });
    </script>
</body>
</html>
